# Office LAN additions, copied to /etc/smartdns/office.conf by network-reconfigure while the
# registered Tencent adapter is up with an address and a DHCP gateway, and emptied otherwise.
# Everything here is unreachable off the office LAN, which is why it cannot live in the base config.
#
# The `server` lines for this site are generated from that adapter's DHCP lease and appended by
# network-reconfigure; they are not listed here because every office advertises its own resolvers.
#
# iOA bootstrap follows the same authorization switch as its owner route. On the office LAN these
# names use the lease-derived office resolvers and the owner mark looks up wired_underlay, so the
# internal answer is reachable without nesting bootstrap inside the tunnel it establishes. Away
# from the office this whole fragment is removed atomically: the base config selects the public
# china group and the owner mark falls back to main. Keeping both halves on one switch is essential;
# the earlier broken state resolved freeconnect.ioa.tencent.com to 10.88.202.158 while still routing
# the owner mark to Wi-Fi, which made iOA send unreachable SYNs forever.
nameserver /smartgate.oa.tencent.com/office
nameserver /sgw.woa.com/office
nameserver /ioa.tencent.com/office

# Domains the base config points at the tunnel resolver are not listed here. network-reconfigure
# derives those overrides from the base config itself, because iOA starts its DNS server only in the
# EXTRA and OVERSEA scenes and answers INTRA on this LAN, leaving the `ioa` group with no upstream.

# Additional domains only available on office LAN
nameserver /tencentcos.cn/office
ipset /tencentcos.cn/ioa
nameserver /oa.com/office
ipset /oa.com/ioa
nameserver /boss.com/office
ipset /boss.com/ioa
nameserver /isd.com/office
ipset /isd.com/ioa
nameserver /exmail.work.weixin.qq.com/office
ipset /exmail.work.weixin.qq.com/ioa
nameserver /exmail.qq.com/office
ipset /exmail.qq.com/ioa
