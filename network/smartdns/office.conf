# Office LAN additions, copied to /etc/smartdns/office.conf by network-reconfigure while the
# registered Tencent adapter is up with an address and a DHCP gateway, and emptied otherwise.
# Everything here is unreachable off the office LAN, which is why it cannot live in the base config.
#
# The `server` lines for this site are generated from that adapter's DHCP lease and appended by
# network-reconfigure; they are not listed here because every office advertises its own resolvers.
#
# iOA's own bootstrap domains are deliberately absent. They stay on the public `china` group of the
# base config, because iOA's transport is owner-marked onto `main` and the office wired link
# contributes no default route there. Resolving them internally on 2026-09-20 returned
# freeconnect.ioa.tencent.com = 10.88.202.158, which is reachable only through the wired link or the
# tunnel, so iOA sent SYNs to it over Tencent-WiFi every three seconds and never logged in. The
# public answer is reachable from whichever network holds the default route, on or off this LAN.

# Additional domains only available on office LAN
nameserver /tencentcos.cn/ioa
ipset /tencentcos.cn/ioa
nameserver /oa.com/ioa
ipset /oa.com/ioa
nameserver /boss.com/ioa
ipset /boss.com/ioa
nameserver /isd.com/ioa
ipset /isd.com/ioa
nameserver /exmail.work.weixin.qq.com/ioa
ipset /exmail.work.weixin.qq.com/ioa
nameserver /exmail.qq.com/ioa
ipset /exmail.qq.com/ioa
