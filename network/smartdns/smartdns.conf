# SmartDNS main configuration
# Listens on localhost only; resolv.conf points here
bind-tcp 127.0.0.1:53 -no-cache -no-serve-expired
bind 127.0.0.1:53 -no-cache -no-serve-expired
tcp-idle-time 3
# No local DNS cache: every client query reaches the selected upstream.
cache-size 0
cache-persist no
prefetch-domain no
serve-expired no
# SmartDNS defaults to a 600-second minimum even without cache. Zero preserves upstream TTL.
rr-ttl-min 0
# Speed-check ranks the candidate addresses in an answer by probing them. It is
# `ping` only, and deliberately not `tcp:80,tcp:443`.
#
# A TCP probe opens a real connection to the address being ranked, so it follows
# the full policy routing — including the exit node. When the exit node cannot
# carry traffic (this happens on any network that blocks DERP TLS and UDP, which
# hotel and airport wifi routinely do) every probe hangs until it times out, and
# SmartDNS holds the answer until the probes finish. The resolver then times out
# on 127.0.0.1 and the machine looks completely offline, several seconds after
# tailscale came up.
#
# That failure is circular in the worst way: the bypass that would restore
# connectivity is decided by a daemon that needs DNS to probe, and DNS is what
# just died. ICMP has no such coupling — no connection, no port, nothing for a
# tunnel to swallow — and ranking by latency alone is enough for the split
# routing this file exists to drive.
speed-check-mode ping
log-level info
force-AAAA-SOA yes

# --- Default upstream (DoT for integrity; DHCP DNS for captive portal) ---
server-tls 8.8.8.8:853
server-tls 1.1.1.1:853

# DHCP-provided DNS, rewritten on every link change by network-reconfigure:
conf-file /etc/smartdns/dhcp-dns.conf

# --- China domain acceleration ---
conf-file /etc/smartdns/accelerated-domains.china.smartdns.conf
conf-file /etc/smartdns/apple.china.smartdns.conf
conf-file /etc/smartdns/bogus-nxdomain.china.smartdns.conf
server 114.114.114.114 -group china -exclude-default-group
server 223.5.5.5 -group china -exclude-default-group
nameserver /deepseek.com/china

# --- IOA ---
# Keep the IOA resolver configured independently of tun0 state. SmartDNS handles
# an unreachable upstream; IOA names fail closed instead of falling back public.
server 192.168.255.10 -group ioa -exclude-default-group

nameserver /es.tencentyun.com/ioa
ipset /es.tencentyun.com/ioa
nameserver /mirrors.tencent.com/ioa
ipset /mirrors.tencent.com/ioa
nameserver /woa.com/ioa
ipset /woa.com/ioa
nameserver /m.tencent.com/ioa
ipset /m.tencent.com/ioa
nameserver /mnet2.com/ioa
ipset /mnet2.com/ioa
nameserver /oa.tencent.com/ioa
ipset /oa.tencent.com/ioa
nameserver /tencentelasticsearch.com/ioa
ipset /tencentelasticsearch.com/ioa
nameserver /mytsearch.com/ioa
ipset /mytsearch.com/ioa
nameserver /production.polaris/ioa
ipset /production.polaris/ioa
nameserver /tco-es.polaris/ioa
ipset /tco-es.polaris/ioa

# IOA bootstrap. These name the tunnel's own endpoints: public addresses the
# IOA client dials to build the tunnel, so they are underlay and must stay off
# it. Resolved via China DNS. They cannot be kept out of the `ioa` ipset here:
# domain rules are suffix matches, so sgw.woa.com is caught by /woa.com/, and
# `-no-rule-ipset` does not stop the add (measured). The exemption that matters
# lives in network-reconfigure, which makes NETMODE_IOA skip these addresses
# before it marks anything.
nameserver /smartgate.oa.tencent.com/china
nameserver /sgw.woa.com/china
nameserver /ioa.tencent.com/china

# --- Office LAN additions, written by network-reconfigure ---
# Populated only while a wired interface is up; empty everywhere else.
conf-file /etc/smartdns/office.conf
