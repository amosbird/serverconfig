# SmartDNS mode: inside office (wired LAN)
# Adds extra IOA DNS servers reachable only on office network
# And additional domains only resolvable on LAN

# Extra intranet DNS servers (only reachable on office LAN)
server 10.76.3.38 -group ioa -exclude-default-group
server 10.76.3.39 -group ioa -exclude-default-group
server 10.14.198.15 -group ioa -exclude-default-group

# Additional domains only available on office LAN
nameserver /tencentcos.cn/ioa
ipset /tencentcos.cn/ioa
nameserver /oa.com/ioa
ipset /oa.com/ioa
nameserver /boss.com/ioa
ipset /boss.com/ioa
nameserver /isd.com/ioa
ipset /isd.com/ioa
nameserver /exmail.work.weixin.qq.com/ioa
ipset /exmail.work.weixin.qq.com/ioa
nameserver /exmail.qq.com/ioa
ipset /exmail.qq.com/ioa
