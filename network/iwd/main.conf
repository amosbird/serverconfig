[General]
# Use a stable generated MAC per SSID; Tencent-WiFi overrides this in its local secret profile.
AddressRandomization=network
# Let systemd-networkd handle IP configuration
EnableNetworkConfiguration=false
# Do not lower the roam thresholds to stop roaming here: the 2026-09-18 roams happened at -55 to
# -72 dBm, above the -76 dBm default for 5GHz, so RSSI never triggered them and moving the threshold
# changes nothing. The trigger is still unidentified; see network/README.md.
# Use external wpa_supplicant is not needed; iwd handles WPA natively
# For EAP-TLS (Tencent-WiFi), iwd supports it directly

[Scan]
DisablePeriodicScan=false
# Do not disable the roaming scan to stop roaming here. The 2026-09-18 roams were the low-signal path
# doing its job: eleven `roam-scan` events each produced exactly one `roam-info`, with no
# `beacon-loss-roam` or `packet-loss-roam`, which is correct behaviour for a station walking through a
# building. Disabling it holds a dying access point instead of moving. The defect is that this network
# stops forwarding after a roam, and the repair belongs in scripts/network-dhcp-refresh.

[Network]
# Route metric for iwd-managed routes (unused since networkd handles it)
RoutePriorityOffset=300
