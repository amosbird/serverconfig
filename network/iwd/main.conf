[General]
# Let systemd-networkd handle IP configuration
EnableNetworkConfiguration=false
# Use external wpa_supplicant is not needed; iwd handles WPA natively
# For EAP-TLS (Tencent-WiFi), iwd supports it directly

[Scan]
DisablePeriodicScan=false

[Network]
# Route metric for iwd-managed routes (unused since networkd handles it)
RoutePriorityOffset=300
