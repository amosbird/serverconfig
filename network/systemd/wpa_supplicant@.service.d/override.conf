# Override for wpa_supplicant@.service to use our wired 802.1X config
# Placed at /etc/systemd/system/wpa_supplicant@.service.d/override.conf
[Unit]
BindsTo=sys-subsystem-net-devices-%i.device
After=sys-subsystem-net-devices-%i.device

[Service]
ExecStart=
ExecStart=/usr/bin/wpa_supplicant -D wired -c /etc/wpa_supplicant/wpa_supplicant-wired.conf -i %I

[Install]
WantedBy=
WantedBy=sys-subsystem-net-devices-%i.device
