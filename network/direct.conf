# Destinations that are only meaningful on the current link, so they must reach the
# network the machine is attached to instead of the selected Tailscale exit node.
#
# A line is an IPv4 address, an IPv4 prefix, or a hostname. A hostname is resolved
# through the link's own DHCP-lease resolver, which is the only server that can answer
# for a link-local name; addresses and prefixes are used as written.
#
# This exists because nothing in an address says it is link-local. A hotel portal VIP
# can be any public address the hotel happens to own, and on 2026-09-24 the JinJiang
# portal's own address was Cloudflare's 1.1.1.5 — correct on that LAN, and the anycast
# address of an unrelated CDN everywhere else. An exit node captured it, the wrong host
# answered, and the browser reported ERR_SSL_VERSION_OR_CIPHER_MISMATCH.
#
# Keep this list short. Every entry is pinned to the physical gateway and outranks the
# IOA and CN bands, so a wrong entry sends a destination that should have been tunnelled
# onto the local network, where it will not be reachable.
#
# Prefer the hostname over the address when a network is known to use one, because the
# address can change between sites and the name is what the network advertises.
#
# JinJiang / Linkbroad hotel portals. `portal.linkbroad.com` is what the gateway's
# landing page redirects to, and what DHCP option 114 would name if this network
# advertised it (it does not).
portal.linkbroad.com
