# Bound how long iOA's connections may hold unacknowledged data: 30s, then ETIMEDOUT and iOA
# reconnects. Without it a connection killed by a suspend or a network change keeps swallowing the
# ngn heartbeat for 10-15 minutes, the TGT is never renewed, and every intranet request is refused
# with 103009 while the GUI shows logged in. See network/ioa-sockops.bpf.c and network/README.md.
#
# Wants=, not Requires=: if the program cannot be loaded systemd skips the attach with a warning and
# the tunnel still comes up.
[Unit]
Wants=ioa-sockops.service
After=ioa-sockops.service

[Service]
BPFProgram=sock_ops:/sys/fs/bpf/ioa-user-timeout
