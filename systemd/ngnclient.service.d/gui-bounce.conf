# Bounce the GUI when the daemon restarts.
#
# `ngnclient.service` is a system unit with no desktop environment, so the client's own attempt to
# restart the GUI (`su -l <user> -c '… systemctl --user restart ioagui.service'`) never resolves a
# session and silently does nothing. The GUI is left holding a socket to the local agent that was
# just restarted, and it has no timer that would try again.
#
# `try-restart`, not `restart`: at boot this runs before anything has started the GUI, and starting
# it there is not a repair. Only a GUI that is already running is bounced.
#
# The `-` is deliberate. This must never fail the unit that owns the tunnel.
#
# The user name and runtime directory are spelled out because this drop-in belongs to a system
# unit, where `%h` and `%u` resolve to root. systemd/ioagui.service is written the same way for the
# same reason.
[Service]
ExecStartPost=-/usr/bin/su -l amos -c 'XDG_RUNTIME_DIR=/run/user/1000 /usr/bin/systemctl --user try-restart ioagui.service'
