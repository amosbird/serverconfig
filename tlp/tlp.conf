CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off
PCIE_ASPM_ON_BAT=powersupersave
DEVICES_TO_DISABLE_ON_BAT="nfc wwan"
# dGPU (+ its HDMI audio and root port): always allow runtime PM, also on AC. gpu-power unloads
# the idle nvidia driver on battery; without a driver the card only reaches D3cold if runtime PM
# is allowed, otherwise RUNTIME_PM_ON_AC=on pins it in unmanaged D0 at ~25W. When something needs
# the GPU, loading the driver resumes it and nvidia's own RTD3 takes over.
RUNTIME_PM_ENABLE="00:01.0 01:00.0 01:00.1"
