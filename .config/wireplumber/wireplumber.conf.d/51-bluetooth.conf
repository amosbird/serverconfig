wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
  bluetooth.use-persistent-storage = false
  device.restore-profile = false
  linking.follow-default-target = true
  node.restore-default-targets = false
}

monitor.bluez.properties = {
  # This is deliberately monitor-wide: reconsider it before adding an A2DP-only device.
  bluez5.roles = [ hfp_hf hfp_ag ]
  bluez5.enable-msbc = true
  bluez5.hfphsp-backend = "native"
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "bluez_card.C0_DA_5E_EC_FB_7F" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hfp_ag ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_output.C0_DA_5E_EC_FB_7F.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 3
      }
    }
  }
  {
    matches = [
      { node.name = "bluez_input.C0:DA:5E:EC:FB:7F" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 3
      }
    }
  }
]

stream.rules = [
  {
    matches = [
      { application.process.binary = "wemeetapp" }
    ]
    actions = {
      update-props = {
        # Do not resurrect a stale user-selected target, but preserve explicit target.object.
        state.restore-target = false
      }
    }
  }
]

wireplumber.components = [
  {
    name = "90-freeclip-mute-intent.lua", type = script/lua
    provides = hooks.audio.freeclip-mute-intent
    requires = [ api.mixer ]
  }
]

wireplumber.profiles = {
  main = {
    hooks.audio.freeclip-mute-intent = required
  }
}

# Deliberate observability boundary: RUNNING, uncorked, silence, and missing RecordStream
# cannot distinguish a quiet/listen-only meeting from stale Wemeet playback. Never automate
# stream destruction, suspension, application restart, Bluetooth reconnect, rfkill, or BlueZ reset.
