wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  bluez5.roles = [ hfp_hf hfp_ag ]
  bluez5.enable-msbc = true
}

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.C0_DA_5E_EC_FB_7F.*" }
      { node.name = "bluez_input.C0:DA:5E:EC:FB:7F" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 3
      }
    }
  }
]
