[tools]
direnv = "latest"
eza = "latest"
ripgrep = "latest"
rclone = "latest"
fd = "latest"
fzf = "latest"
k6 = "latest"
shfmt = "latest"
"github:gsamokovarov/jump" = "0.67.0"
"github:docker/docker-credential-helpers" = { version = "latest", matching = "docker-credential-pass", bin = "docker-credential-pass" }
atuin = "latest"
"github:fish-shell/fish-shell" = { version = "latest", exe = "fish" }
"github:kovidgoyal/kitty" = { version = "latest", matching = "kitten-", bin = "kitten" }
sqlc = "latest"
"github:amosbird/clipserver" = "latest"
zig = "latest"
"github:upx/upx" = "latest"
micromamba = "latest"
gopass = "latest"
uv = "latest"
gh = "latest"
"github:git-lfs/git-lfs" = { version = "latest", exe = "git-lfs" }

[settings]
experimental = true
libc = "musl"
