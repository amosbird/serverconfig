<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Abush browser automation</title>
<link rel="stylesheet" href="popup.css">
<body>
<h1>Abush browser automation</h1>
<p>Dedicated background work tabs only. Your other tabs remain freely usable.</p>
<button id="toggle">Stop automation</button>
<p id="state" aria-live="polite">Connecting…</p>
<ul id="workbenches"></ul>
<p>Start/Stop applies to all workbenches and survives browser restarts. Stop leaves all pages and groups open.</p>
<p id="error" role="alert"></p>
<script src="popup.js"></script>
</body>
</html>
