Section "Files"
    ModulePath "/usr/lib/nvidia/xorg"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen 0 "nvidia"
    Inactive "intel"
EndSection

Section "Device"
    Identifier "intel"
    Driver "modesetting"
    BusID "PCI:0:2:0"
EndSection

Section "Device"
    Identifier "nvidia"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    # Pretend a monitor is on DFP-0. With nothing attached, NVIDIA sets mode
    # "NULL", never allocates a real framebuffer, and reverse PRIME to the
    # Intel-attached panel fails with "randr: failed to create shared pixmap".
    # This makes the no-monitor case look like the external-monitor case, which
    # already boots fine. movehome then switches to eDP-1-1 as usual.
    Option "ConnectedMonitor" "DFP-0"
    Option "AllowEmptyInitialConfiguration"
EndSection

Section "Screen"
    Identifier "intel"
    Device "intel"
EndSection

Section "Screen"
    Identifier "nvidia"
    Device "nvidia"
EndSection
