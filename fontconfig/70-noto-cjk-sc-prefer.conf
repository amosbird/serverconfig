<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Prefer Simplified Chinese Noto CJK faces over the JP defaults</description>

  <!--
    Host-local, for servers that ship only DejaVu + Noto CJK (TencentOS, etc).
    Install to /etc/fonts/conf.d/ rather than ~/.config/fontconfig, which is a
    symlink into this repo and shared with the Arch desktop: that box prefers
    WenQuanYi and Symbols Nerd Font and must keep its own order untouched.

    Numbered 70 on purpose. google-noto-*-cjk-*.conf land at 65/66 and prepend
    their faces, and local.conf is pulled in at 51, so anything earlier than 66
    loses to the package rules.

    What this actually fixes, measured with CDP CSS.getPlatformFontsForNode
    rather than fc-match, which does not predict Chromium's fallback:

      A page with no lang attribute renders Chinese in Noto Sans CJK JP, so
      characters whose shapes differ between regions (直 骨 次 者 每 令) come out
      with Japanese variants. The package rules only test lang=zh-cn/zh-sg and
      bind every regional face to the generic families via <default>, leaving JP
      to win when the page declares nothing. With this file the same page gets
      Noto Sans CJK SC.

      A page that does declare lang="zh-CN" already resolves to SC on its own;
      this file changes nothing there.

    Note that Chromium ignores the serif/monospace distinction when it falls
    back for CJK: an element styled font-family: serif still renders Chinese in
    Noto Sans CJK SC, not Noto Serif CJK SC, which only applies when CSS names
    it explicitly. The serif and monospace rules below are kept because they do
    take effect for other fontconfig clients.
  -->

  <!-- Bare "zh" and any zh-* variant: pin the SC faces to the front. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!--
    Untagged requests. mode="append" inserts just after the generic family,
    which still leaves DejaVu ahead for Latin but puts SC in front of the
    regional faces the packages bind with <default>, i.e. append_last.
    Net effect: Latin unchanged, CJK gets SC instead of JP.
  -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
</fontconfig>
